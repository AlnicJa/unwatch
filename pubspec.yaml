name: unwatch
description: Unwatch — See what's watching you. ALPR, Flock, and red light camera map with proximity alerts and camera-avoiding route planning.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Location & sensors
  geolocator: ^11.0.0
  flutter_compass: ^0.8.0

  # Routing & geometry
  http: ^1.2.0
  turf: ^0.0.8

  # Local storage
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Notifications (proximity alerts)
  flutter_local_notifications: ^17.1.2
  flutter_background_service: ^5.0.5

  # UI
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  animations: ^2.0.11
  sliding_up_panel: ^2.0.0+1
  permission_handler: ^11.3.1

  # GPX / file export
  share_plus: ^9.0.0
  xml: ^6.5.0

  # Riverpod state management
  flutter_riverpod: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0a0a0f"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/
